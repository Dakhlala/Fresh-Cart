<div class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center justify-between gap-3 p-4 rounded-xl shadow-xl border text-sm font-medium transition-all duration-300 animate-in fade-in slide-in-from-top-4"
      [class.bg-emerald-50]="toast.type === 'success'"
      [class.border-emerald-200]="toast.type === 'success'"
      [class.text-emerald-800]="toast.type === 'success'"
      [class.bg-red-50]="toast.type === 'error'"
      [class.border-red-200]="toast.type === 'error'"
      [class.text-red-800]="toast.type === 'error'"
      [class.bg-blue-50]="toast.type === 'info'"
      [class.border-blue-200]="toast.type === 'info'"
      [class.text-blue-800]="toast.type === 'info'"
    >
      <div class="flex items-center gap-3">
        @if (toast.type === 'success') {
          <i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
        } @else if (toast.type === 'error') {
          <i class="fa-solid fa-circle-exclamation text-red-600 text-lg"></i>
        } @else {
          <i class="fa-solid fa-circle-info text-blue-600 text-lg"></i>
        }
        <span>{{ toast.text }}</span>
      </div>

      <button
        (click)="toastService.remove(toast.id)"
        class="text-gray-400 hover:text-gray-600 cursor-pointer p-1 rounded-lg transition-colors"
      >
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
  }
</div>
